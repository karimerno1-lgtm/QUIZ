<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizora – Discover Yourself. Challenge Your Mind.</title>
    <meta name="description" content="Explore 21+ free interactive personality tests, trivia challenges, brain teasers, and love compatibility quizzes on Quizora. Challenge friends and share results." />
    <link rel="canonical" href="https://quiz.wdbloog.com" />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quizora" />
    <meta property="og:title" content="Quizora – Discover Yourself. Challenge Your Mind." />
    <meta property="og:description" content="Explore 21+ free interactive personality tests, trivia challenges, brain teasers, and love compatibility quizzes on Quizora." />
    <meta property="og:url" content="https://quiz.wdbloog.com" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quizora – Discover Yourself. Challenge Your Mind." />
    <meta name="twitter:description" content="Explore 21+ free interactive personality tests, trivia challenges, brain teasers, and love compatibility quizzes." />
    
    <!-- Typography: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- Google AdSense Global Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3618365568004987" crossorigin="anonymous"></script>

    <!-- Structured Data Organization & WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://quiz.wdbloog.com/#organization",
          "name": "Quizora",
          "url": "https://quiz.wdbloog.com",
          "logo": "https://quiz.wdbloog.com/logo.svg",
          "slogan": "Discover. Challenge. Share."
        },
        {
          "@type": "WebSite",
          "@id": "https://quiz.wdbloog.com/#website",
          "url": "https://quiz.wdbloog.com",
          "name": "Quizora",
          "description": "Discover Yourself. Challenge Your Mind with interactive personality tests, knowledge quizzes, and trivia.",
          "publisher": { "@id": "https://quiz.wdbloog.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://quiz.wdbloog.com/quizzes?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
